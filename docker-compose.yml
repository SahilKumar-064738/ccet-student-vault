version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ccet_vault_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ccet_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: ccet_vault_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ccet_network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: ccet_vault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccet_vault
      POSTGRES_USER: ccet_user
      POSTGRES_PASSWORD: ccet_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ccet_network

  redis:
    image: redis:alpine
    container_name: ccet_vault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ccet_network

networks:
  ccet_network:
    driver: bridge

volumes:
  postgres_data:
