name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ccet
          POSTGRES_USER: ccet_user
          POSTGRES_PASSWORD: ccet_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ccet_user" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo_pgsql, mbstring
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Copy .env
        run: cp .env.example .env

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ccet
          DB_USERNAME: ccet_user
          DB_PASSWORD: ccet_pass
        run: php artisan migrate --env=testing --no-interaction

      - name: Run tests
        run: php artisan test --no-interaction
